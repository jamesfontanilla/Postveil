name = "email-service"
main = "worker/index.ts"
compatibility_date = "2026-08-25"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

[observability]
enabled = true

[triggers]
crons = ["* * * * *"]

[vars]
# Set these values for your deployment. Configure a Cloudflare custom domain
# in the dashboard after deploying the Worker.
APP_DOMAIN = "your-domain.example"
ALLOWED_SENDER_DOMAINS = "your-domain.example"
DEFAULT_FROM_EMAIL = "postmaster@your-domain.example"
