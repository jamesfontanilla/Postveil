name = "postveil"
main = "worker/index.ts"
compatibility_date = "2026-08-25"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

[observability]
enabled = true

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[triggers]
crons = ["* * * * *"]

# Configure APP_DOMAIN, ALLOWED_SENDER_DOMAINS, and DEFAULT_FROM_EMAIL as
# deployment secrets/variables in the Cloudflare dashboard or via Wrangler.
# They are intentionally not committed so example values cannot reach a live
# deployment.
