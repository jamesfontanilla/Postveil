name = "postveil"
main = "worker/index.ts"
compatibility_date = "2026-08-25"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "postveil-prod"
database_id = "7fc56fec-1358-45df-b5f3-29e3fbe888aa"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "MAIL_STORAGE"
bucket_name = "postveil-prod-mail"

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[triggers]
crons = ["* * * * *"]

[vars]
# Postveil's isolated deployment configuration. Provider credentials remain
# Worker secrets and are never committed to this repository.
APP_DOMAIN = "postveil.me"
ALLOWED_SENDER_DOMAINS = "*"
DEFAULT_FROM_EMAIL = "postmaster@postveil.me"
SYSTEM_FROM_EMAIL = "noreply@postveil.me"
INBOUND_MX_TARGETS = "inbound-smtp.ap-southeast-1.amazonaws.com"
ATTACHMENTS_ENABLED = "true"
AWS_SES_REGION = "ap-southeast-1"
SES_CONFIGURATION_SET_NAME = "postveil-events"
SES_RECEIPT_RULE_SET_NAME = "postveil-inbound"
SES_INBOUND_BUCKET = "postveil-inbound-456631682196-ap-southeast-1"
SES_INBOUND_LAMBDA_ARN = "arn:aws:lambda:ap-southeast-1:456631682196:function:postveil-ses-inbound"
TURNSTILE_SITE_KEY = "0x4AAAAAAEqXXuhzdUlMoSuz"
PROVIDER_FAILOVER_ENABLED = "false"
GOOGLE_CLIENT_ID = "585169946821-gu9e4aldgf7ro3vfmb7a4djsu57t0vn0.apps.googleusercontent.com"
CLOUDFLARE_OAUTH_CLIENT_ID = "3944177cefa074b8c330aff1b76f36af"
# The OAuth client must include these matching scopes for automatic
# customer-domain DNS and inbound-route setup.
CLOUDFLARE_OAUTH_SCOPES = "zone.read zone_settings.write email_routing_rules.write"
CLOUDFLARE_OAUTH_TOKEN_AUTH_METHOD = "client_secret_basic"
CLOUDFLARE_EMAIL_WORKER_NAME = "postveil"

[[routes]]
pattern = "postveil.me"
custom_domain = true

[[routes]]
pattern = "accounts.postveil.me"
custom_domain = true

[[routes]]
pattern = "docs.postveil.me"
custom_domain = true

[[routes]]
pattern = "deck.postveil.me"
custom_domain = true

[[routes]]
pattern = "meet.postveil.me"
custom_domain = true

[[routes]]
pattern = "postveil.jamesfontanilla.com"
custom_domain = true

[[routes]]
pattern = "accounts.postveil.jamesfontanilla.com"
custom_domain = true

[[routes]]
pattern = "docs.postveil.jamesfontanilla.com"
custom_domain = true

[[routes]]
pattern = "meet.postveil.jamesfontanilla.com"
custom_domain = true



