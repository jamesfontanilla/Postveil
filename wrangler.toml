name = "postveil"
main = "worker/index.ts"
compatibility_date = "2026-08-25"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "./dist"
binding = "ASSETS"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "postveil-prod"
database_id = "7fc56fec-1358-45df-b5f3-29e3fbe888aa"
migrations_dir = "migrations"

[[ratelimits]]
name = "API_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[triggers]
crons = ["* * * * *"]

[vars]
# Postveil's isolated deployment configuration. Provider credentials remain
# Worker secrets and are never committed to this repository.
APP_DOMAIN = "postveil.jamesfontanilla.com"
ALLOWED_SENDER_DOMAINS = "jamesfontanilla.com,postveil.jamesfontanilla.com"
DEFAULT_FROM_EMAIL = "postmaster@jamesfontanilla.com"
B2_ENDPOINT = "https://s3.us-east-005.backblazeb2.com"
B2_REGION = "us-east-005"
B2_BUCKET = "postveil-prod-private"
AWS_SES_REGION = "ap-southeast-1"
PROVIDER_FAILOVER_ENABLED = "false"
GOOGLE_CLIENT_ID = "585169946821-gu9e4aldgf7ro3vfmb7a4djsu57t0vn0.apps.googleusercontent.com"
CLOUDFLARE_OAUTH_CLIENT_ID = "3944177cefa074b8c330aff1b76f36af"
CLOUDFLARE_OAUTH_SCOPES = "zone.read dns.read"

[[routes]]
pattern = "postveil.jamesfontanilla.com"
custom_domain = true
