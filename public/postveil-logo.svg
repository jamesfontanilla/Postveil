<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-labelledby="title desc">
  <title id="title">Postveil</title>
  <desc id="desc">Two overlapping planes inside a rounded square seal.</desc>
  <defs>
    <clipPath id="seal"><rect x="6" y="6" width="88" height="88" rx="22"/></clipPath>
  </defs>
  <rect x="6" y="6" width="88" height="88" rx="22" fill="#F4F7F4"/>
  <polygon points="0,0 68,0 22,100 0,100" clip-path="url(#seal)" fill="#1F6B58"/>
  <polygon points="78,0 100,0 100,100 32,100" clip-path="url(#seal)" fill="#172522" transform="translate(3,-3)"/>
</svg>
