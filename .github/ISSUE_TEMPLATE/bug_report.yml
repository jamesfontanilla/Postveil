name: Bug report
description: Report a reproducible problem in Parcel.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include passwords, API keys, access tokens, mailbox contents, or personal email addresses.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include the route or feature, safe reproduction steps, and relevant non-sensitive logs.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit or version
      description: Which commit or release are you using?
    validations:
      required: true
